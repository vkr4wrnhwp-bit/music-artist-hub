# TRACE — motocross telemetry and tuning platform.
#
# A standalone TypeScript workspace under mx-lab/. Nothing outside that
# directory can affect this suite, so nothing outside it triggers this run.
name: TRACE

on:
  push:
    branches: [main]
    paths:
      - mx-lab/**
      - .github/workflows/trace.yml
  pull_request:
    paths:
      - mx-lab/**
      - .github/workflows/trace.yml

jobs:
  test:
    name: domain tests, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mx-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mx-lab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
