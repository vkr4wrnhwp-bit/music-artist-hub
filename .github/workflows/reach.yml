# REACH — music discovery, opportunity intelligence and outreach.
#
# A standalone Python application under reach-app/. Nothing outside that
# directory can affect this suite, so nothing outside it triggers this run.
name: REACH

on:
  push:
    branches: [main]
    paths:
      - reach-app/**
      - .github/workflows/reach.yml
  pull_request:
    paths:
      - reach-app/**
      - .github/workflows/reach.yml

jobs:
  test:
    name: tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reach-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reach-app/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
