name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-app:
    name: Flask app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  trace:
    name: TRACE domain tests, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mx-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mx-lab/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  masterclip:
    name: MASTERCLIP OS typecheck, lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterclip-os
    steps:
      - uses: actions/checkout@v4
      # The QC engine renders and probes real defective MP4s, so ffmpeg is a
      # test dependency, not just a runtime one. The runner image does not
      # ship it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: masterclip-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
