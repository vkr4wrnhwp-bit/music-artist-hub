<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:#0b0b0d;color:#fff}
/* main p-4 */
main{padding:1rem}
.wrap{margin-left:auto;margin-right:auto;max-width:1150px}
/* ---- Tailwind equivalents used by #rk-zone ---- */
#rk-zone{margin-left:auto;margin-right:auto;width:100%;max-width:760px;
  align-items:center;gap:.75rem;border-radius:.75rem;border-width:1px;
  border-color:rgba(201,162,74,.4);background:#141209;padding:.625rem 1rem;}
.t9{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.25em;color:#6b7280}
.tsm{font-size:.875rem;line-height:1.25rem;font-weight:900}
.mono11{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:#e8c667}
.sw{border-radius:3px;border-width:1px;border-color:#3a3424;background:linear-gradient(180deg,#221e15,#14120c);color:#cfc6b0;font-weight:700}
.px3{padding-left:.75rem;padding-right:.75rem}.py15{padding-top:.375rem;padding-bottom:.375rem}
.px25{padding-left:.625rem;padding-right:.625rem}.px2{padding-left:.5rem;padding-right:.5rem}
.py1{padding-top:.25rem;padding-bottom:.25rem}
.tsmb{font-size:.875rem;line-height:1.25rem;font-weight:900}
.t10{font-size:10px}
.mlauto{margin-left:auto}
/* ---- dock ---- */
#rk-dock{position:fixed;left:0;right:0;bottom:0;border-top-width:1px;border-color:rgba(201,162,74,.3);background:rgba(12,11,9,.95);padding:.5rem 1rem}
#rk-dock .inner{margin-left:auto;margin-right:auto;display:flex;max-width:1100px;align-items:center;gap:.75rem}
.px4{padding-left:1rem;padding-right:1rem}.txs{font-size:.75rem;line-height:1rem;font-weight:900}
#rk-wave{height:2.5rem;min-width:0;flex:1 1 0%;border-radius:.25rem;border-width:1px;border-color:rgba(255,255,255,.1);background:rgba(0,0,0,.5)}
#rk-time{width:6rem;flex-shrink:0;text-align:center;font-family:ui-monospace,monospace;font-size:10px;font-variant-numeric:tabular-nums;color:#c9bd9c}
.hidden{display:none}
/* ---- pick label (SB-12 cap-only) ---- */
.pick{display:flex;flex-wrap:wrap;gap:5px}
.pick label{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:46px;padding:4px 6px 3px;border-radius:3px;border:1px solid #3a3424;background:#221e15}
.pick .cap{font-family:'Arial Narrow',Arial,sans-serif;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a7c5d;white-space:nowrap}
.plate{position:relative;border-radius:4px;border:1px solid #2b2519;padding:10px 10px 8px}
.plate>.lg{position:absolute;top:-6px;left:9px;padding:0 5px;font-family:'Arial Narrow',Arial,sans-serif;font-size:8px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8a7c5d;background:#16130e}
/* fader */
.fader{-webkit-appearance:none;appearance:none;height:20px;background:transparent}
.fader::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#0a0a0a}
.fader::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:17px;margin-top:-6px;border-radius:2px;background:#d8b25a}
.w28{width:7rem}
.chassis{position:relative;width:760px;margin:0 auto;aspect-ratio:768/1376}
</style></head><body>
<main><div class="wrap">

<div id="rk-zone" style="display:flex">
  <span class="t9">Zone</span>
  <span class="tsm" id="zn">Vocals</span>
  <span class="mono11" id="zb">1000Hz +0.0 · 2000Hz +0.0 · 4000Hz +0.0</span>
  <button class="sw px3 py15 tsmb">&minus;1 dB</button>
  <button class="sw px3 py15 tsmb">+1 dB</button>
  <button class="sw px25 py15 t10">Reset zone</button>
  <button class="sw px2 py1 t10 mlauto">Done</button>
</div>

<div style="height:20px"></div>
<div style="overflow-x:auto" id="chwrap"><div class="chassis" id="ch"></div></div>

<div class="plate" style="margin-top:20px" id="plate1">
  <span class="lg">Container</span>
  <div class="pick" id="fmt">
    <label id="capl"><span class="cap">WAV</span></label>
    <label><span class="cap">AIFF</span></label>
    <label><span class="cap">FLAC</span></label>
    <label><span class="cap">ALAC</span></label>
    <label><span class="cap">MP3</span></label>
    <label><span class="cap">AAC</span></label>
    <label><span class="cap">Opus</span></label>
    <label><span class="cap">OGG</span></label>
  </div>
</div>
<input class="fader w28" id="fd" type="range" min="0" max="1.2" step=".02" value="1">
</div></main>

<div id="rk-dock"><div class="inner">
  <button class="sw px4 py15 txs" id="p2">Play</button>
  <canvas id="rk-wave"></canvas>
  <span id="rk-time">0:00 / 0:00</span>
  <div class="hidden w28" style="flex-shrink:0"></div>
  <button class="sw px3 py15 t10" id="ab2">Bypass: OFF</button>
  <button class="sw px3 py15 t10 hidden">Export</button>
</div></div>
<div style="height:56px"></div>

<pre id="out" style="position:fixed;top:0;left:0;background:#000;color:#0f0;font:11px monospace;z-index:99;padding:6px;white-space:pre-wrap;max-width:100%"></pre>
<script>
function r(el){var b=el.getBoundingClientRect();return Math.round(b.width)+"x"+Math.round(b.height);}
window.addEventListener('load',function(){
 var L=[];
 L.push("viewport innerWidth = "+window.innerWidth);
 L.push("doc scrollWidth = "+document.documentElement.scrollWidth+"  (body scrolls sideways: "+(document.documentElement.scrollWidth>window.innerWidth)+")");
 var z=document.getElementById('rk-zone');
 L.push("#rk-zone box = "+r(z)+"  scrollWidth="+z.scrollWidth+"  right edge="+Math.round(z.getBoundingClientRect().right));
 L.push("  zone buttons:");
 z.querySelectorAll('button').forEach(function(b){L.push("    ["+b.textContent.trim()+"] "+r(b));});
 L.push("  Done right edge = "+Math.round(z.querySelector('.mlauto').getBoundingClientRect().right));
 L.push("#rk-wave = "+r(document.getElementById('rk-wave')));
 L.push("#rk-play2 = "+r(document.getElementById('p2'))+"   #rk-ab2 = "+r(document.getElementById('ab2'))+"  #rk-time = "+r(document.getElementById('rk-time')));
 L.push("dock inner scrollWidth = "+document.querySelector('#rk-dock .inner').scrollWidth);
 L.push("chassis = "+r(document.getElementById('ch'))+"   pan container = "+r(document.getElementById('chwrap')));
 L.push("pick cap-only label = "+r(document.getElementById('capl')));
 L.push("fader w-28 = "+r(document.getElementById('fd')));
 L.push("plate legend font = "+getComputedStyle(document.querySelector('.plate>.lg')).fontSize);
 document.getElementById('out').textContent=L.join("\n");
});
</script>
</body></html>
