# REACH's standalone service definition.
#
# NOTE: Render's Blueprint flow only reads render.yaml from the *repository
# root*, so this file is not what gets deployed while REACH lives in this
# repo — the root render.yaml declares the `reach` service and is the one to
# sync. This copy is kept for two reasons: it is immediately correct if REACH
# moves to its own repository, and it documents the service on its own terms.
#
# To deploy REACH without a blueprint: create a Web Service, set Root Directory
# to `reach-app`, and use the build and start commands below.
#
# Keep this file and the root one in step if either changes.
services:
  - type: web
    name: reach
    runtime: python
    rootDir: reach-app
    plan: starter # a paid instance is required for the persistent disk below.
    # On the free plan, delete the `disk:` block and the REACH_DB_PATH value —
    # REACH still runs, but its database resets on every deploy and restart.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      # Where the SQLite store lives. Must be on the mounted disk to survive.
      - key: REACH_DB_PATH
        value: /var/data/reach.db
      # Encrypts contact records and credentials at rest. Render generates this
      # once and keeps it; losing it makes existing encrypted rows unreadable.
      - key: REACH_ENCRYPTION_KEY
        generateValue: true
      # Who REACH treats as the acting principal until it has real sessions.
      - key: REACH_PRINCIPAL_EMAIL
        sync: false
      - key: REACH_PRINCIPAL_ROLE
        value: OWNER
    disk:
      name: reach-data
      mountPath: /var/data
      sizeGB: 1
