# Lint configuration only. This project has no packaging metadata and does not
# need any — `python app.py` and `pytest` remain the entry points.

[tool.ruff]
target-version = "py312"
extend-exclude = ["mx-lab", "fuel-map-tool"]  # separate products in this repo

[tool.ruff.lint]
# Ruff's default rules: pycodestyle errors plus pyflakes. These catch genuine
# defects — undefined names, unused imports, shadowed variables — without
# imposing a formatter on a codebase that predates this config. Line length is
# deliberately not enforced: the existing files run to ~120 characters and
# reformatting them is not this change's job.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Adapter packages re-export their submodules for the ADAPTERS registry.
"reach/providers/__init__.py" = ["F401"]
