# Lint and test configuration for Royalty Sweep only. This project has no
# packaging metadata and does not need any — `python app.py` and `pytest`
# remain the entry points.
#
# The other products in this repository are separate applications with their
# own configuration and their own CI jobs: mx-lab (TRACE) and reach-app
# (REACH). They are excluded here rather than linted or collected by accident.

[tool.ruff]
target-version = "py312"
extend-exclude = ["mx-lab", "reach-app"]  # separate products

[tool.ruff.lint]
# Ruff's default rules: pycodestyle errors plus pyflakes. These catch genuine
# defects — undefined names, unused imports, shadowed variables — without
# imposing a formatter on a codebase that predates this config. Line length is
# deliberately not enforced: the existing files run to ~120 characters and
# reformatting them is not this change's job.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
