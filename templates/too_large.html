{% extends "base.html" %}
{% block title %}File too large - Street Banker{% endblock %}
{% block content %}
<div class="mx-auto max-w-[760px] space-y-5">
  <div>
    <p class="sb-label sb-label-gold">Upload</p>
    <h1 class="sb-h1 mt-1">That file is too large</h1>
  </div>
  <section class="sb-panel p-4">
    <p class="text-sm text-gray-300">{{ message }}</p>
    <p class="mt-3 text-sm text-gray-300">
      Nothing was uploaded and nothing was charged. The limit is
      {{ limit_mb }} MB per file.
    </p>
  </section>
  <p class="text-sm text-gray-300">
    <a class="underline" href="javascript:history.back()">Go back and choose another file</a>
  </p>
</div>
{% endblock %}
