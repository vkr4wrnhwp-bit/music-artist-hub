# Render reads this file from the repository root, so every service that should
# be deployable from a Blueprint has to be declared here — a render.yaml inside
# a subdirectory is never picked up by the Blueprint flow.
#
# The services below are separate products that share nothing but this file.
# Each has its own rootDir, its own runtime and its own disk; syncing the
# blueprint creates or updates them independently.
#
#   trace  — mx-lab/     motocross session tracking (Node)
#   reach  — reach-app/  music discovery and outreach (Python)
#
# Details: mx-lab/docs/architecture/deployment.md and reach-app/README.md.
services:
  - type: web
    name: trace
    runtime: node
    rootDir: mx-lab
    plan: starter # a paid instance is required for the persistent disk below;
    # on the free plan, delete the `disk:` block — the server runs, but its
    # data resets on every deploy/restart (browsers keep local data and re-push)
    buildCommand: npm install && npm run build
    startCommand: npx tsx apps/server/src/main.ts
    healthCheckPath: /
    envVars:
      - key: TRACE_DATA_DIR
        value: /var/data
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    disk:
      name: trace-data
      mountPath: /var/data
      sizeGB: 1

  # REACH — music discovery, opportunity intelligence and outreach.
  # Shares no process, database or code with the service above.
  #
  # ---------------------------------------------------------------------
  # STORAGE IS EPHEMERAL ON THIS PLAN.
  #
  # The free plan cannot mount a disk, so REACH's SQLite database lives in
  # the container filesystem and is destroyed whenever the container is
  # replaced — on every deploy, on every restart, and after the free plan
  # spins the service down for inactivity. That last one happens routinely,
  # not rarely.
  #
  # What is lost each time: the track catalog, campaigns, discovered
  # opportunities and their evidence, recorded placements, the audit chain,
  # and the suppression list. Losing suppression is the one with a victim —
  # a recipient who opted out is no longer on record as having opted out.
  #
  # So this plan is right for trying REACH and wrong for outreach anyone
  # actually receives. REACH says so on its own start screen rather than
  # leaving it in this comment.
  #
  # To make storage durable: set plan to `starter`, restore the disk block
  #     disk:
  #       name: reach-data
  #       mountPath: /var/data
  #       sizeGB: 1
  # and add REACH_DB_PATH = /var/data/reach.db so the store lands on it.
  # ---------------------------------------------------------------------
  - type: web
    name: reach
    runtime: python
    rootDir: reach-app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      # REACH_DB_PATH is deliberately unset: with no disk to point it at,
      # naming a path would only make the store look durable. Unset, REACH
      # uses its default location and reports the storage as ephemeral.
      #
      # Encrypts contact records at rest. Render generates this once and keeps
      # it across restarts, so it outlives the data it protects.
      - key: REACH_ENCRYPTION_KEY
        generateValue: true
      # Who REACH treats as the acting principal until it has real sessions.
      # Render prompts for this value when the blueprint is synced.
      - key: REACH_PRINCIPAL_EMAIL
        sync: false
      - key: REACH_PRINCIPAL_ROLE
        value: OWNER
