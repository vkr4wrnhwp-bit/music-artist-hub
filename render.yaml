services:
  - type: web
    name: street-banker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 180
    envVars:
      # Sessions survive restarts; Render generates a strong random value.
      - key: SECRET_KEY
        generateValue: true
      # Rotate the demo showcase account's password: set the value in the
      # Render dashboard (Environment tab). Never commit it.
      - key: DEMO_PASSWORD
        sync: false
      # Release-Ready (Creative Studio): the RoEx Tonn API key. Paste it in
      # the Render dashboard (Environment tab) once RoEx has approved the
      # account and credits are bought. Never commit it.
      - key: ROEX_API_KEY
        sync: false
      # Cover Studio renders: OpenAI's gpt-image-1 makes the covers once this
      # is set, and each account gets its plan's covers a month (numbers in
      # Settings > Cover art renders). Unset, the free Pollinations model is
      # used and nothing is counted. Paste it in the dashboard. Never commit it.
      - key: OPENAI_API_KEY
        sync: false
      # Error reporting (Sentry). Paste the project DSN in the dashboard;
      # unset, observability.py never starts the SDK. Never commit it.
      - key: SENTRY_DSN
        sync: false
      # Persistent storage (Starter instance + 1GB disk): database and all
      # uploads (documents, covers, EPK photos, sync audio) live under this
      # path together, so the one disk below covers everything.
      - key: DATABASE_PATH
        value: /var/data/streetbanker.db
    disk:
      name: street-banker-data
      mountPath: /var/data
      sizeGB: 1
