# Render reads this file from the repository root, so every service that should
# be deployable from a Blueprint has to be declared here — a render.yaml inside
# a subdirectory is never picked up by the Blueprint flow.
#
# The services below are separate products that share nothing but this file.
# Each has its own rootDir, its own runtime and its own disk; syncing the
# blueprint creates or updates them independently.
#
#   trace       — mx-lab/         motocross session tracking (Node)
#   reach       — reach-app/      music discovery and outreach (Python)
#   masterclip  — masterclip-os/  cinematic AI-video render factory (Docker)
#
# Details: mx-lab/docs/architecture/deployment.md and reach-app/README.md.
services:
  - type: web
    name: trace
    runtime: node
    rootDir: mx-lab
    plan: starter # a paid instance is required for the persistent disk below;
    # on the free plan, delete the `disk:` block — the server runs, but its
    # data resets on every deploy/restart (browsers keep local data and re-push)
    buildCommand: npm install && npm run build
    startCommand: npx tsx apps/server/src/main.ts
    healthCheckPath: /
    envVars:
      - key: TRACE_DATA_DIR
        value: /var/data
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    disk:
      name: trace-data
      mountPath: /var/data
      sizeGB: 1

  # REACH — music discovery, opportunity intelligence and outreach.
  # Shares no process, database or code with the service above.
  #
  # This service runs on a paid starter instance with a mounted disk, so the
  # SQLite store survives deploys, restarts and spin-downs. That durability is
  # what makes REACH fit for real use: the catalog, campaigns, evidence,
  # placements, the audit chain and — above all — the suppression list persist.
  #
  # To run free instead (trial only): set plan to `free`, delete the `disk:`
  # block and the REACH_DB_PATH env var. Everything still runs, but the
  # database dies with the container and REACH's start screen will say so as a
  # blocking item. Do not send real outreach from a free instance: losing the
  # suppression list means losing the record of who opted out.
  - type: web
    name: reach
    runtime: python
    rootDir: reach-app
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      # Where the SQLite store lives. On the mounted disk so it outlives the
      # container.
      - key: REACH_DB_PATH
        value: /var/data/reach.db
      # Encrypts contact records at rest. Render generates this once and keeps
      # it; losing or changing it makes existing encrypted rows unreadable.
      - key: REACH_ENCRYPTION_KEY
        generateValue: true
      # Who REACH treats as the acting principal until it has real sessions.
      # Render prompts for this value when the blueprint is synced.
      - key: REACH_PRINCIPAL_EMAIL
        sync: false
      - key: REACH_PRINCIPAL_ROLE
        value: OWNER
    disk:
      name: reach-data
      mountPath: /var/data
      sizeGB: 1

  # MASTERCLIP OS — cinematic AI-video render factory.
  #
  # Docker rather than the native Node runtime because ffmpeg and ffprobe are
  # load-bearing here, not incidental: they render, probe, measure and transcode
  # on the critical path, and QC is meaningless without them. The Dockerfile
  # installs them properly instead of smuggling a static binary into a runtime
  # that has no package manager.
  #
  # One container runs both processes. Generation never happens inside an HTTP
  # request — the API queues work and a worker performs it — so a deployment
  # that started only the API would accept renders and never run them.
  # scripts/serve.mjs starts the worker and the API together and exits if either
  # dies, so the platform restarts a half-running factory rather than leaving it
  # accepting work it cannot do.
  - type: web
    name: masterclip
    runtime: docker
    rootDir: masterclip-os
    dockerfilePath: ./Dockerfile
    plan: starter # a paid instance is required for the disk below, and rendered
    # video needs somewhere durable to live. On the free plan, delete the `disk:`
    # block and the two /var/data paths: everything still runs, but the database
    # and every rendered clip vanish on each deploy, restart and spin-down.
    healthCheckPath: /api/health
    # `rootDir` already stops a change under reach-app/ or mx-lab/ from
    # rebuilding this service. What it does not stop is a documentation edit
    # inside masterclip-os/ triggering the full ffmpeg-and-27-packages image
    # build, which is several minutes of builder time to publish a paragraph.
    # Build filter paths are relative to the repo root even though rootDir is
    # set, so they are spelled out in full here.
    buildFilter:
      paths:
        - masterclip-os/**
      ignoredPaths:
        - masterclip-os/docs/**
        - masterclip-os/*.md
        - masterclip-os/**/*.md
    envVars:
      # Render terminates TLS and proxies, so X-Forwarded-For is written by a
      # proxy we control and can be believed. Without this every visitor shares
      # one rate-limit bucket, because Fastify would report the proxy's address
      # for all of them. It defaults to off precisely so that trusting it is a
      # deliberate statement about the deployment.
      - key: TRUST_PROXY
        value: "true"
      # The database and every rendered clip, thumbnail and master, on the disk
      # mounted below so they outlive the container.
      - key: SQLITE_PATH
        value: /var/data/masterclip.sqlite
      - key: STORAGE_LOCAL_ROOT
        value: /var/data/storage
      # SESSION_SECRET signs CSRF tokens. The session cookie itself is an
      # opaque random token, so rotating this logs nobody out. The other one
      # signs media URLs, and rotating that does invalidate every outstanding
      # link. Render generates each once and keeps it. Neither may be blank:
      # under NODE_ENV=production the application refuses to start rather than
      # fall back to a value published in this repository.
      - key: SESSION_SECRET
        generateValue: true
      - key: ASSET_SIGNING_SECRET
        generateValue: true
      # The owner account, created at boot before anything is listening. The
      # first account to reach /api/auth/signup bootstraps the organization and
      # closes signup behind itself, which on a public URL is a race against the
      # internet; seeding first means that race is already over. Render prompts
      # for both when the blueprint is synced.
      - key: SEED_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false
    disk:
      name: masterclip-data
      mountPath: /var/data
      sizeGB: 5
