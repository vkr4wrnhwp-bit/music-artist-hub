# Render reads this file from the repository root, so every service that should
# be deployable from a Blueprint has to be declared here — a render.yaml inside
# a subdirectory is never picked up by the Blueprint flow.
#
# The services below are separate products that share nothing but this file.
# Each has its own rootDir, its own runtime and its own disk; syncing the
# blueprint creates or updates them independently.
#
#   trace          — mx-lab/         motocross session tracking (Node)
#   reach          — reach-app/      music discovery and outreach (Python)
#   royalty-sweep  — repo root/      royalty dashboard (Python/Flask)
#
# Holeshot Tuner is not here either. Its fuel and ignition map editing now
# lives inside TRACE, which already carried the same grid as a workflow with
# revisions, approval and per-bike ECU axes; keeping a second copy of the same
# tool alongside it was the same mistake as the one below, one product earlier.
#
# MASTERCLIP OS is deliberately not here. It lives in its own repository,
# github.com/vkr4wrnhwp-bit/masterclip-os, and is deployed from that repo's own
# render.yaml. It used to be built from a masterclip-os/ directory here, which
# meant every upstream commit had to be hand-copied into this repo before it
# reached production; the copy silently fell six days and seventeen packages
# behind once (see #55), and a cost-control fix later sat in the copy while the
# real product shipped without it. One product, one repo, one blueprint.
#
# Details: mx-lab/docs/architecture/deployment.md, reach-app/README.md and
# DEPLOY.md (which app is which, and what each costs to run).
services:
  - type: web
    name: trace
    runtime: node
    rootDir: mx-lab
    plan: starter # a paid instance is required for the persistent disk below;
    # on the free plan, delete the `disk:` block — the server runs, but its
    # data resets on every deploy/restart (browsers keep local data and re-push)
    buildCommand: npm install && npm run build
    startCommand: npx tsx apps/server/src/main.ts
    healthCheckPath: /
    envVars:
      - key: TRACE_DATA_DIR
        value: /var/data
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    disk:
      name: trace-data
      mountPath: /var/data
      sizeGB: 1

  # REACH — music discovery, opportunity intelligence and outreach.
  # Shares no process, database or code with the service above.
  #
  # This service runs on a paid starter instance with a mounted disk, so the
  # SQLite store survives deploys, restarts and spin-downs. That durability is
  # what makes REACH fit for real use: the catalog, campaigns, evidence,
  # placements, the audit chain and — above all — the suppression list persist.
  #
  # To run free instead (trial only): set plan to `free`, delete the `disk:`
  # block and the REACH_DB_PATH env var. Everything still runs, but the
  # database dies with the container and REACH's start screen will say so as a
  # blocking item. Do not send real outreach from a free instance: losing the
  # suppression list means losing the record of who opted out.
  - type: web
    name: reach
    runtime: python
    rootDir: reach-app
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      # Where the SQLite store lives. On the mounted disk so it outlives the
      # container.
      - key: REACH_DB_PATH
        value: /var/data/reach.db
      # Encrypts contact records at rest. Render generates this once and keeps
      # it; losing or changing it makes existing encrypted rows unreadable.
      - key: REACH_ENCRYPTION_KEY
        generateValue: true
      # Who REACH treats as the acting principal until it has real sessions.
      # Render prompts for this value when the blueprint is synced.
      - key: REACH_PRINCIPAL_EMAIL
        sync: false
      # The access gate. Give it a value in the dashboard and every /reach
      # screen requires it once per browser; leave it empty and the app stays
      # open. The public landing page and /healthz are never gated.
      - key: REACH_ACCESS_KEY
        sync: false
      - key: REACH_PRINCIPAL_ROLE
        value: OWNER
    disk:
      name: reach-data
      mountPath: /var/data
      sizeGB: 1

  # ROYALTY SWEEP — the royalty dashboard that this repository started as.
  # Lives at the repository root (app.py + templates/ + royalty_data.py), so it
  # takes no rootDir. Its data is in-process demo data, so it needs no disk and
  # runs honestly on a free instance: nothing is lost on a restart because
  # nothing is written. `/` redirects to `/dashboard`, which is the health check.
  - type: web
    name: royalty-sweep
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /dashboard
    buildFilter:
      paths:
        - app.py
        - royalty_data.py
        - music_utils/**
        - templates/**
        - requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
